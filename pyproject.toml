[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opensail"
version = "1.0.0"
description = "Local AI dashboard for ComfyUI, llama.cpp and audio.cpp"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "requests>=2.31",
    "Pillow>=10.0",
    "websockets>=12.0",
]

[tool.setuptools]
packages = ["comfyui_ui"]
